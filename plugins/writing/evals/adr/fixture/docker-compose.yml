services:
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      API_KEY: REPLACE_WITH_YOUR_KEY
      DB_PATH: /data/dev.sqlite3
    volumes:
      - ./data:/data

  # Production uses a managed Postgres instance. Uncomment to run one locally.
