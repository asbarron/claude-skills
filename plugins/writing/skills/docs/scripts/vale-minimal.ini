# Generated by build_rules.py from ../../../.vale.ini; do not edit.
# Canonical Vale config for the writing plugin. The hook, lint-docs.sh, CI, and
# the Docker harness all point at this file. Run `vale sync --config <this file>`
# once to download the pinned packages; without them lint-docs.sh falls back to
# scripts/vale-minimal.ini (the Writing style only).
StylesPath = ../../../styles
MinAlertLevel = suggestion

# URL-pinned so Renovate can bump them (see renovate.json customManagers).

Vocab = Writing

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Vale, Writing
# Google is primary. Cherry-pick Microsoft rules the Google package lacks.
# Noisy heuristics downgraded; the judge handles real passive-voice calls.
# American quote punctuation is a typography nit that fights code-adjacent prose.
# Changelogs and ADR status lines legitimately use time words and "we will".
[CHANGELOG.md]
Writing.GenR004 = NO
[adr-*.md]
